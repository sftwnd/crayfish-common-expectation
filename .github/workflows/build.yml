name: build

on:
  push:
    branches: [ master, develop ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: JDK ${{ matrix.java }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        java: [ '8', '11', '17', '21', '25' ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Build and test
        run: ./mvnw -B -ntp verify

  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      # the line endings of the checkout come from .gitattributes only
      - name: No conversion of the line endings by git
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the line endings of the scripts
        shell: bash
        run: |
          git ls-files --eol mvnw mvnw.cmd .github/scripts/check-modular-jar.sh
          git ls-files --eol mvnw.cmd | grep -q 'w/crlf' || { echo "mvnw.cmd is not checked out with CRLF"; exit 1; }
          git ls-files --eol mvnw | grep -q 'w/lf' || { echo "mvnw is not checked out with LF"; exit 1; }
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test with mvnw.cmd
        run: .\mvnw.cmd -B -ntp verify

  module:
    name: Modular jar
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          # the last one is the default: the jar is built on JDK 21, and Java 8 runs a consumer on the class path
          java-version: |
            8
            21
          cache: maven
      - name: Build
        run: ./mvnw -B -ntp package -DskipTests
      - name: Check the module descriptor, the module path and Java 8
        run: .github/scripts/check-modular-jar.sh "$JAVA_HOME_8_X64"

  sonar:
    name: SonarCloud
    # secrets are not available to pull requests from forks
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Skip without the secret SONAR_TOKEN
        if: env.SONAR_TOKEN == ''
        run: echo "::notice::The secret SONAR_TOKEN is not set, the analysis is skipped"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.SONAR_TOKEN != ''
        with:
          # the whole history, for the blame information of the analysis
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        if: env.SONAR_TOKEN != ''
        with:
          distribution: temurin
          # the scanner requires Java 21; the classes are still compiled with --release 8
          java-version: '21'
          cache: maven
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: env.SONAR_TOKEN != ''
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: Build, test and analyze
        if: env.SONAR_TOKEN != ''
        run: >-
          ./mvnw -B -ntp verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.organization=sftwnd-github
          -Dsonar.projectKey=sftwnd_crayfish_common_expectation
