version: 2
updates:
  # the actions of the workflows, pinned by their commit SHAs with the version in a comment
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    groups:
      actions:
        patterns:
          - "*"

  # the dependencies and the plugins of the pom
  - package-ecosystem: maven
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    groups:
      maven:
        patterns:
          - "*"
    ignore:
      # JUnit 6 requires Java 17: the tests run on Java 8 as well
      - dependency-name: "org.junit:junit-bom"
        update-types: [ "version-update:semver-major" ]
      # the 4.x plugins of Apache Maven are for Maven 4: the build runs on Maven 3.10
      - dependency-name: "org.apache.maven.plugins:*"
        update-types: [ "version-update:semver-major" ]
